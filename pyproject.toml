[project]
name = "callmap-local"
version = "0.1.0"
description = "Persistent Python call graphs for agents and humans"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
semantic = ["jedi>=0.19.2,<0.21"]
mcp = ["mcp>=1.12,<2"]
dev = ["pytest>=8,<9", "ruff>=0.9", "playwright>=1.45"]
binary = ["pyinstaller==6.16.0"]

[project.scripts]
callmap = "callmap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["callmap"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
